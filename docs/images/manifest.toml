# The pictures the documentation shows, and what draws each one.
#
# Rendered by ../../../tools/doc_images.py, which is run from a checkout of the
# workspace: several of these come from projects that sit beside this one.
#
#   tools/doc_images.py --list
#   tools/doc_images.py --only showcase/glisteel-forest-road
#   tools/doc_images.py --check
#
# `licence` is required, and is the licence of what is *in* the picture: a
# render of a third-party model carries that model's terms.  Nothing under a
# non-commercial, share-alike or otherwise restricted licence is declared here
# -- see ATTRIBUTION.md for the whole list and the reasoning.

[defaults]
quality = 82
size = [900, 640]

# --------------------------------------------------------------------------- #
# Showcase: what the engine draws, on the pages a reader meets first.
# 16:9, because that is the shape a game window is.
# --------------------------------------------------------------------------- #
[[image]]
id = "showcase/glisteel-forest-road"
out = "images/gallery/showcase/glisteel-forest-road.jpg"
size = [1200, 675]
licence = "BSD-3-Clause; CC0 assets"
credit = "GLinting Steel"
alt = "A car on a two-lane road through dense forest, seen from behind and above"
caption = "<strong>GLinting Steel</strong> &mdash; a lap of a baked 3D Tiles world, streamed in around the car as it drives."
producer = "command"
cwd = "glisteel"
timeout = 900
# A recorded lap, replayed: the engine's clock is fed the recorded frame
# times and the seed is put back, so the car reaches the same place every
# run, and the capture is asked for by frame rather than after a wall-clock
# delay. Two runs write the same bytes. See glisteel/sessions/README.md.
replay = "sessions/doc-lap.jsonl"
argv = ["-m", "glisteel.game", "baked-world/tileset.json", "--size", "1600x900",
        "--view", "chase", "--no-hud", "--autopilot",
        "--capture-frame", "569", "--capture", "{png}"]

[[image]]
id = "showcase/glisteel-viaduct"
out = "images/gallery/showcase/glisteel-viaduct.jpg"
size = [1200, 675]
licence = "BSD-3-Clause; CC0 assets"
credit = "GLinting Steel"
alt = "A car crossing a railed viaduct over a forested valley, mountains beyond"
caption = "The circuit is carried over the low ground rather than routed round it: a walled causeway, a viaduct across the valleys, a bore through the hills."
producer = "command"
cwd = "glisteel"
timeout = 900
# Frame 1297 of the same recorded lap: mid-viaduct, over the valley.
replay = "sessions/doc-lap.jsonl"
argv = ["-m", "glisteel.game", "baked-world/tileset.json", "--size", "1600x900",
        "--view", "chase", "--no-hud", "--autopilot",
        "--capture-frame", "1297", "--capture", "{png}"]

[[image]]
id = "showcase/forest-walk"
out = "images/gallery/showcase/forest-walk.jpg"
size = [1200, 675]
licence = "BSD-3-Clause; CC0 assets"
credit = "the forest demo"
alt = "A hillside of firs over undergrowth, seen from standing height"
caption = "<strong><code>oglc-forest</code></strong> &mdash; half a million instanced trees and grass clumps on a real digital elevation model, walked at eye height."
producer = "command"
cwd = "openglcontext-forest"
harness = "auto-exit"
frames = 90
timeout = 900
argv = ["-m", "openglcontext_forest_demo.run", "--quality", "high", "--seed", "3"]

[[image]]
id = "showcase/parthenon"
out = "images/gallery/showcase/parthenon.jpg"
size = [1200, 675]
licence = "CC0 1.0"
credit = "the Parthenon model, CC0"
alt = "Inside a Greek temple, looking down the inner colonnade at a painted coffered ceiling"
caption = "A reconstruction walked from the inside: baked cameras, a painted ceiling, and light through the colonnade."
producer = "copy"
source = "images/parthenon/5-naos-entering.jpg"

[[image]]
id = "showcase/flight-helmet"
out = "images/gallery/showcase/flight-helmet.jpg"
size = [1200, 675]
licence = "CC0 1.0"
credit = "FlightHelmet, public domain (CC0)"
alt = "A leather flight helmet with goggles and an oxygen mask, lit from the side"
caption = "Leather, glass, rubber and painted metal on one model, lit by an image-based probe."
producer = "copy"
source = "images/flighthelmet.jpg"
# The source is a 4K screen capture with the developer overlay and the viewer's
# reference thumbnail in it; the model itself sits right of centre.
crop = [0.18, 0.16, 0.913, 0.93]

[[image]]
id = "showcase/marble-board"
out = "images/gallery/showcase/marble-board.jpg"
size = [1200, 675]
licence = "MIT; CC0 assets"
credit = "the marble demo"
alt = "A chrome marble on a tilted tiled board of ramps and gaps"
caption = "<strong><code>oglc-marble</code></strong> &mdash; a generated board, tilted by the player, with the marble rolled by the rigid-body solver."
producer = "command"
cwd = "marble-demo"
timeout = 600
# The game opens on a board that sits low in its window, so take the lower part
# of the render rather than scaling the empty sky above it into the slide.
crop = [0.0, 0.30, 1.0, 1.0]
argv = ["tools/capture.py", "--seed", "3", "--difficulty", "8", "--marble", "chrome",
        "--frames", "120", "--lean", "0.35", "0.2", "--size", "1600x900",
        "--out", "{png}"]

[[image]]
id = "showcase/track-editor"
out = "images/gallery/showcase/track-editor.jpg"
size = [1137, 875]
licence = "BSD-3-Clause"
credit = "the GLinting Steel track editor"
alt = "A track editor: a circuit of numbered points drawn on a shaded relief map with contours, a lake and a river, and a tool palette down the left"
caption = "A circuit drawn on a landscape, with the bridges and the tunnel the road generator worked out from the ground under the line."
producer = "command"
cwd = "glisteel-editor"
harness = "auto-exit"
frames = 150
timeout = 600
# The map is square and sized by the window's height, so a window wider than
# that leaves black beside it; take the part the editor actually draws in.
crop = [0.0, 0.0, 0.8121, 1.0]
argv = ["-m", "glisteel_editor.app", "samples/ashdown.glisteel", "--size", "1400x875"]

[[image]]
id = "showcase/crowd"
out = "images/gallery/showcase/crowd.jpg"
size = [1200, 675]
licence = "BSD-3-Clause; model CC-BY 4.0"
credit = "Fox by PixelMannen and tomkranis, CC-BY 4.0"
alt = "A field of a hundred and fifty rigged fox figures, each at a different point in a walk or a run"
caption = "A hundred and fifty rigged figures, posed on the GPU and drawn as one instanced call, each crossing the field on its own."
producer = "script"
cwd = "openglcontext"
module = "crowd_demo"
render_size = [1600, 900]
frames = 60
timeout = 600
env = { OPENGLCONTEXT_SHADOWS = "1" }

[[image]]
id = "showcase/tiles-toronto"
out = "images/gallery/showcase/tiles-toronto.jpg"
size = [1200, 675]
licence = "BSD-3-Clause; City of Toronto open data"
credit = "City of Toronto 3D massing, Open Government Licence"
alt = "A city of blocky buildings stretching to the horizon under a clear sky"
caption = "An OGC 3D&nbsp;Tiles dataset streamed from an octree, refined by screen-space error as the camera moves."
producer = "copy"
source = "images/toronto-3dtiles.jpg"
crop = [0.0, 0.0, 1.0, 0.94]     # the viewer's key hints run along the bottom

[[image]]
id = "showcase/chess"
out = "images/gallery/showcase/chess.jpg"
size = [1200, 675]
licence = "CC-BY 4.0"
credit = "A Beautiful Game, &copy; ASWF and Ed Mackey, CC-BY 4.0"
alt = "A glass and metal chess set on a board, outdoors under a bright sky"
caption = "Glass, metal and marble under image-based lighting, with screen-space transmission through the glass pieces."
producer = "copy"
source = "images/beautiful-game.jpg"
# A 4K screen capture: the viewer's reference thumbnail is in the top corner and
# its caption along the bottom.
crop = [0.02, 0.14, 0.98, 0.95]

