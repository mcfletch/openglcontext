# --------------------------------------------------------------------------- #
# Demos: a picture of a demo script, for the page that describes what it shows.
# --------------------------------------------------------------------------- #
[[image]]
id = "demos/gallery"
out = "images/demos/gallery.jpg"
size = [1200, 675]
licence = "CC0 1.0"
credit = "'Marble Bust 01' by Rico Cilliers (Poly Haven) and ambientCG materials, CC0"
alt = "A long hall of marble busts on plinths, receding under dark ceiling beams"
caption = "The bust gallery: 120 busts, each a six-level chain, seen from the near end of the hall."
producer = "command"
cwd = "openglcontext"
timeout = 900
# The world is a content pack, so this fetches it the first time and reads the
# unpacked copy afterwards; a machine that cannot reach it skips the entry and
# keeps the committed picture.  "Gallery" is the camera the world was authored
# with for this view, down the length of the hall.
argv = ["-m", "OpenGLContext.bin.view",
        "https://github.com/mcfletch/openglcontext/releases/download/content-v1/gallery-world.tar.gz",
        "--camera", "Gallery", "--size", "1600x900", "--capture", "{png}"]

[[image]]
id = "demos/particles_effects"
out = "images/demos/particles_effects.jpg"
size = [1100, 680]
licence = "BSD-3-Clause"
alt = "Fire, smoke, sparks and an explosion burning side by side in the dark"
caption = "The five presets, side by side"
producer = "script"
module = "particles_effects"
render_size = [1600, 900]
# The world clock advances a frame at a time under the capture harness, so a
# frame number is a moment: 81 is 1.35 seconds in, a tenth of a second after
# the burst timer last fired, with the fire and the smoke column established
# and the explosion at its widest.
frames = 81
# The five effects sit in a band across the middle of the window the demo
# opens, with the floor's near edge below them: this is that band, and no
# more of the dark around it than the shape of the picture asks for.
crop = [0.2125, 0.304, 0.775, 0.922]

