# Third-party interiors, opened in oglc-view from the workspace's
# content-samples/ directory, which is not in any repository: where a model is
# absent the entry is skipped and the committed picture stands.  The eye and
# target are in the viewer's frame -- the model centred and turned to its
# default yaw -- which is the position the viewer reports.
[[image]]
id = "showcase/church-interior"
out = "images/gallery/showcase/church-interior.jpg"
size = [1200, 675]
licence = "CC-BY 4.0; CC0 environment"
credit = "&ldquo;Old church modeling - Interior Scene&rdquo; by Aur&eacute;lien Martel, CC-BY 4.0; sky by Greg Zaal and Sergej Majboroda (Poly Haven), CC0"
alt = "Looking up the nave of a Gothic church to the stained-glass windows of its apse and the rib vault above"
caption = "A Gothic interior lit by the sky through its windows: stained glass, rib vaults and weathered stone, opened straight from a Sketchfab glTF."
producer = "command"
cwd = "content-samples"
timeout = 900
requires = ["old_church_modeling_-_interior_scene.glb"]
argv = ["-m", "OpenGLContext.bin.view", "old_church_modeling_-_interior_scene.glb",
        "--size", "1600x900", "--frames", "30",
        "--environment", "kloofendal_43d_clear_puresky",
        "--eye=-3.8,-7.6,-2.5", "--look-at=3.27,-1.0,4.57",
        "--capture", "{png}"]

