<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 250" role="img" aria-label="Without bias a surface self-shadows (acne); a small bias clears it; too much bias detaches the shadow from the object (peter-panning).">
  <!-- panel 1: acne. The stored depth is quantized to one value per texel, so the
       sloped surface crosses it: where a step sits ABOVE the surface (red), the
       surface reads as farther than the recorded nearest depth and shadows itself. -->
  <text x="20" y="24" font-size="13" font-weight="bold" fill="#556">No bias</text>
  <g stroke-width="2.4">
    <!-- treads: red = above the surface (self-shadow), gold = below -->
    <line x1="20" y1="146" x2="40" y2="146" stroke="#c0392b"></line>
    <line x1="40" y1="146" x2="60" y2="146" stroke="#c9a24a"></line>
    <line x1="60" y1="138" x2="80" y2="138" stroke="#c0392b"></line>
    <line x1="80" y1="138" x2="100" y2="138" stroke="#c9a24a"></line>
    <line x1="100" y1="130" x2="120" y2="130" stroke="#c0392b"></line>
    <line x1="120" y1="130" x2="140" y2="130" stroke="#c9a24a"></line>
    <line x1="140" y1="122" x2="160" y2="122" stroke="#c0392b"></line>
    <line x1="160" y1="122" x2="180" y2="122" stroke="#c9a24a"></line>
    <line x1="180" y1="114" x2="200" y2="114" stroke="#c0392b"></line>
    <line x1="200" y1="114" x2="220" y2="114" stroke="#c9a24a"></line>
    <!-- risers -->
    <line x1="60" y1="146" x2="60" y2="138" stroke="#c9a24a" stroke-width="1.4"></line>
    <line x1="100" y1="138" x2="100" y2="130" stroke="#c9a24a" stroke-width="1.4"></line>
    <line x1="140" y1="130" x2="140" y2="122" stroke="#c9a24a" stroke-width="1.4"></line>
    <line x1="180" y1="122" x2="180" y2="114" stroke="#c9a24a" stroke-width="1.4"></line>
  </g>
  <!-- true surface on top -->
  <line x1="20" y1="150" x2="220" y2="110" stroke="#333" stroke-width="2.5"></line>
  <!-- speckles on the surface under each step that pokes above it -->
  <g fill="#b23">
    <circle cx="29" cy="148" r="2.6"></circle><circle cx="69" cy="140" r="2.6"></circle>
    <circle cx="109" cy="132" r="2.6"></circle><circle cx="149" cy="124" r="2.6"></circle>
    <circle cx="189" cy="116" r="2.6"></circle>
  </g>
  <text x="20" y="192" font-size="11.5" fill="#822">steps poke above the surface &#8594; it shadows itself</text>
  <line x1="20" y1="206" x2="38" y2="206" stroke="#c0392b" stroke-width="2.4"></line>
  <text x="44" y="210" font-size="10.5" fill="#666">stored depth (one value per texel)</text>

  <!-- panel 2: biased -->
  <text x="260" y="24" font-size="13" font-weight="bold" fill="#556">Small bias</text>
  <line x1="260" y1="150" x2="460" y2="110" stroke="#666" stroke-width="2.5"></line>
  <path d="M260,166 h34 v-8 h34 v-8 h34 v-8 h34 v-8 h34 v-8" fill="none" stroke="#c9a24a" stroke-width="1.6" stroke-dasharray="4,3"></path>
  <text x="260" y="196" font-size="11.5" fill="#284">stored depth pushed below surface &#8594; clean</text>

  <!-- panel 3: peter-panning -->
  <text x="500" y="24" font-size="13" font-weight="bold" fill="#556">Too much bias</text>
  <line x1="500" y1="180" x2="560" y2="180" stroke="#666" stroke-width="2.5"></line>
  <rect x="560" y="120" width="26" height="60" fill="#a7bbe0" stroke="#5a6a90"></rect>
  <line x1="586" y1="180" x2="700" y2="180" stroke="#666" stroke-width="2.5"></line>
  <!-- shadow detached from base -->
  <rect x="612" y="176" width="70" height="8" fill="#3a3f4a" fill-opacity="0.3"></rect>
  <text x="596" y="150" font-size="11.5" fill="#822">shadow floats away</text>
  <text x="596" y="205" font-size="11.5" fill="#822">from the contact point</text>
</svg>
