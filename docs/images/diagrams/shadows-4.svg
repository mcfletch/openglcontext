<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" aria-label="A point light sits inside a cube of six depth maps; a ray through one face measures the distance to an object. The cube unfolds into six faces, one depth render each." role="img" viewbox="0 0 640 300">
<defs>
<marker id="p-ah" markerheight="9" markerwidth="9" orient="auto" refx="7" refy="3"><path d="M0,0 L7,3 L0,6 Z" fill="#333"></path></marker>
<marker id="p-ah2" markerheight="9" markerwidth="9" orient="auto" refx="1" refy="3"><path d="M8,0 L1,3 L8,6 Z" fill="#333"></path></marker>
</defs>
<!-- cube around the light (oblique) : back square + connectors -->
<polygon fill="none" points="110,102 200,102 200,192 110,192" stroke="#9aa8cc" stroke-dasharray="4,3" stroke-width="1"></polygon>
<line stroke="#9aa8cc" stroke-width="1" x1="70" x2="110" y1="140" y2="102"></line>
<line stroke="#9aa8cc" stroke-width="1" x1="160" x2="200" y1="140" y2="102"></line>
<line stroke="#9aa8cc" stroke-width="1" x1="160" x2="200" y1="230" y2="192"></line>
<line stroke="#9aa8cc" stroke-width="1" x1="70" x2="110" y1="230" y2="192"></line>
<!-- right (+X) face highlighted: the ray passes through it -->
<polygon fill="#cfe0c9" fill-opacity="0.6" points="160,140 200,102 200,192 160,230" stroke="#77aa77"></polygon>
<!-- front face of the cube -->
<rect fill="none" height="90" stroke="#5a6a90" stroke-width="1.5" width="90" x="70" y="140"></rect>
<text fill="#556" font-size="11.5" x="60" y="252">a cube of six depth maps around the light</text>
<!-- the light, at the centre of the cube -->
<circle cx="135" cy="170" fill="#ffdf6b" r="12" stroke="#c9a400" stroke-width="1.5"></circle>
<text fill="#665" font-size="11" font-weight="bold" x="103" y="164">light</text>
<!-- an object outside the cube -->
<rect fill="#a7bbe0" height="34" rx="3" stroke="#5a6a90" width="34" x="288" y="152"></rect>
<text fill="#456" font-size="11" x="288" y="204">object</text>
<!-- ray from the light through the +X face to the object, measuring distance -->
<line marker-end="url(#p-ah)" marker-start="url(#p-ah2)" stroke="#333" stroke-width="1.4" x1="135" x2="305" y1="170" y2="169"></line>
<circle cx="181" cy="169" fill="#c0392b" r="3.6"></circle>
<text fill="#334" font-size="11" x="150" y="150">distance to the object,</text>
<text fill="#334" font-size="11" x="150" y="164">stored in the +X face</text>
<!-- unfolded cube (cross of six faces) -->
<text fill="#556" font-size="12" font-weight="bold" x="428" y="34">unfolded: six faces</text>
<g fill="#ffffff" stroke="#77aa77">
<rect height="44" width="44" x="474" y="66"></rect>
<rect height="44" width="44" x="430" y="110"></rect>
<rect height="44" width="44" x="474" y="110"></rect>
<rect height="44" width="44" x="562" y="110"></rect>
<rect height="44" width="44" x="474" y="154"></rect>
</g>
<rect fill="#cfe0c9" fill-opacity="0.6" height="44" stroke="#77aa77" width="44" x="518" y="110"></rect>
<text fill="#254" font-size="11" x="530" y="137">+X</text>
<text fill="#822" font-size="11.5" x="428" y="224">six faces → six depth renders / frame</text>
<text fill="#822" font-size="11.5" x="428" y="242">memory = 6 × resolution² per light</text>
</svg>
