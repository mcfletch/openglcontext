<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 380" role="img" aria-label="The camera and the light each view the scene; a point is in shadow when the light's nearest-depth record shows something closer than that point.">
  <defs>
    <marker id="s-ah" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#555"></path></marker>
  </defs>
  <!-- ground -->
  <line x1="70" y1="330" x2="700" y2="330" stroke="#9a8654" stroke-width="3"></line>
  <text x="70" y="350" font-size="12" fill="#776">ground</text>
  <!-- light -->
  <circle cx="590" cy="46" r="20" fill="#ffdf6b" stroke="#c9a400" stroke-width="2"></circle>
  <text x="560" y="24" font-size="13" font-weight="bold" fill="#665">light</text>
  <!-- occluder -->
  <rect x="380" y="235" width="36" height="95" fill="#a7bbe0" stroke="#5a6a90"></rect>
  <text x="398" y="228" font-size="12" fill="#456" text-anchor="middle">occluder</text>
  <!-- shadow region on ground: LEFT of the occluder, away from the light -->
  <polygon points="380,330 274,330 380,235" fill="#3a3f4a" fill-opacity="0.18"></polygon>
  <!-- ray from the light grazing the occluder's top corner + the shadow edge -->
  <line x1="590" y1="46" x2="380" y2="235" stroke="#e0b000" stroke-width="1.5" stroke-dasharray="5,4"></line>
  <line x1="380" y1="235" x2="274" y2="330" stroke="#8a8a8a" stroke-width="1" stroke-dasharray="3,4"></line>
  <!-- ray light -> P: a lit point just left of the shadow; the ray clears the
       occluder's top, so the light reaches it -->
  <line x1="590" y1="46" x2="250" y2="330" stroke="#e0b000" stroke-width="1.5" stroke-dasharray="5,4" marker-end="url(#s-ah)"></line>
  <circle cx="250" cy="330" r="5" fill="#3a9a3a"></circle>
  <text x="242" y="322" font-size="12" fill="#284" text-anchor="end">P: lit</text>
  <!-- ray light -> Q, intercepted by the occluder (Q sits in the shadow) -->
  <line x1="590" y1="46" x2="416" y2="244" stroke="#e0b000" stroke-width="1.5" stroke-dasharray="5,4"></line>
  <line x1="416" y1="244" x2="340" y2="330" stroke="#cc4444" stroke-width="1.3" stroke-dasharray="3,4"></line>
  <circle cx="340" cy="330" r="5" fill="#b23"></circle>
  <text x="300" y="352" font-size="12" fill="#822">Q: shadowed</text>
  <!-- camera -->
  <rect x="36" y="180" width="40" height="30" rx="3" fill="#dfe4ee" stroke="#66708a"></rect>
  <polygon points="76,188 96,180 96,210 76,202" fill="#dfe4ee" stroke="#66708a"></polygon>
  <text x="30" y="175" font-size="13" font-weight="bold" fill="#556">camera</text>
  <!-- camera view lines to P and Q (neither passes through the occluder) -->
  <line x1="90" y1="202" x2="250" y2="330" stroke="#8894b0" stroke-width="1"></line>
  <line x1="90" y1="202" x2="340" y2="330" stroke="#8894b0" stroke-width="1"></line>
  <!-- note box (top-left, clear of the rays) -->
  <rect x="60" y="34" width="256" height="88" rx="8" fill="#f6f8ff" stroke="#aab6d8"></rect>
  <text x="72" y="56" font-size="12" fill="#334">The light records the nearest</text>
  <text x="72" y="74" font-size="12" fill="#334">depth it sees in each direction.</text>
  <text x="72" y="96" font-size="12" fill="#334">Q sits behind the occluder from</text>
  <text x="72" y="113" font-size="12" fill="#334">the light &#8594; blocked &#8594; shadowed.</text>
</svg>
