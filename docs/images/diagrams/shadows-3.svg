<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 260" role="img" aria-label="The camera view is split into near, mid and far slices; each slice is covered by its own equal-resolution shadow map, so the near slice gets the finest detail.">
  <!-- camera -->
  <polygon points="40,130 40,130 700,30 700,230" fill="none"></polygon>
  <rect x="18" y="116" width="34" height="28" rx="3" fill="#dfe4ee" stroke="#66708a"></rect>
  <text x="14" y="112" font-size="12" fill="#556">camera</text>
  <!-- frustum wedge -->
  <polygon points="52,130 700,34 700,226" fill="#eef2fb" stroke="#9aa8cc"></polygon>
  <!-- split lines -->
  <line x1="250" y1="98" x2="250" y2="162" stroke="#5a6a90" stroke-width="1.5" stroke-dasharray="4,3"></line>
  <line x1="450" y1="66" x2="450" y2="194" stroke="#5a6a90" stroke-width="1.5" stroke-dasharray="4,3"></line>
  <text x="120" y="135" font-size="12" fill="#345">near</text>
  <text x="330" y="135" font-size="12" fill="#345">mid</text>
  <text x="560" y="135" font-size="12" fill="#345">far</text>
  <!-- maps below, all same pixel size -->
  <g>
    <rect x="70" y="205" width="46" height="46" fill="#fff" stroke="#77aa77"></rect>
    <rect x="300" y="205" width="46" height="46" fill="#fff" stroke="#77aa77"></rect>
    <rect x="560" y="205" width="46" height="46" fill="#fff" stroke="#77aa77"></rect>
    <line x1="140" y1="205" x2="112" y2="200" stroke="#999"></line>
  </g>
  <text x="60" y="200" font-size="10.5" fill="#476">map (fine)</text>
  <text x="292" y="200" font-size="10.5" fill="#476">map</text>
  <text x="548" y="200" font-size="10.5" fill="#476">map (coarse coverage)</text>
  <text x="60" y="20" font-size="11.5" fill="#556">Each slice &#8594; its own equal-resolution map; the small near slice gets the most texels per metre.</text>
</svg>
