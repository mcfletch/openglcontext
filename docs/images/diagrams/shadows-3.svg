<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" aria-label="The camera view is split into near, mid and far slices; each slice is covered by its own equal-resolution shadow map, so the near slice gets the finest detail." role="img" viewbox="0 0 720 260">
<!-- camera -->
<polygon fill="none" points="40,130 40,130 700,30 700,230"></polygon>
<rect fill="#dfe4ee" height="28" rx="3" stroke="#66708a" width="34" x="18" y="116"></rect>
<text fill="#556" font-size="12" x="14" y="112">camera</text>
<!-- frustum wedge -->
<polygon fill="#eef2fb" points="52,130 700,34 700,226" stroke="#9aa8cc"></polygon>
<!-- split lines -->
<line stroke="#5a6a90" stroke-dasharray="4,3" stroke-width="1.5" x1="250" x2="250" y1="98" y2="162"></line>
<line stroke="#5a6a90" stroke-dasharray="4,3" stroke-width="1.5" x1="450" x2="450" y1="66" y2="194"></line>
<text fill="#345" font-size="12" x="120" y="135">near</text>
<text fill="#345" font-size="12" x="330" y="135">mid</text>
<text fill="#345" font-size="12" x="560" y="135">far</text>
<!-- maps below, all same pixel size -->
<g>
<rect fill="#fff" height="46" stroke="#77aa77" width="46" x="70" y="205"></rect>
<rect fill="#fff" height="46" stroke="#77aa77" width="46" x="300" y="205"></rect>
<rect fill="#fff" height="46" stroke="#77aa77" width="46" x="560" y="205"></rect>
<line stroke="#999" x1="140" x2="112" y1="205" y2="200"></line>
</g>
<text fill="#476" font-size="10.5" x="60" y="200">map (fine)</text>
<text fill="#476" font-size="10.5" x="292" y="200">map</text>
<text fill="#476" font-size="10.5" x="548" y="200">map (coarse coverage)</text>
<text fill="#556" font-size="11.5" x="60" y="20">Each slice → its own equal-resolution map; the small near slice gets the most texels per metre.</text>
</svg>
