[build-system]
# setuptools >= 77 is required for the PEP 639 SPDX `license` expression below
# (61-76 reject the string form).
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "OpenGLContext"
dynamic = ["version"]
description = "Demonstration and testing contexts for PyOpenGL/OpenGL-ctypes"
readme = "README.md"
license = "BSD-3-Clause"
# The license file is lowercase, so it does NOT match setuptools' case-sensitive
# default LICEN[CS]E* glob and would be dropped from the wheel/sdist metadata.
# Name it explicitly so PEP 639 packaging carries it through.
license-files = ["license.txt"]
# numpy>=2.0 resolves to 2.1+ on new installs, which dropped Python 3.9, so the
# effective floor is 3.10 -- align requires-python with it.
requires-python = ">=3.10"
authors = [
    { name = "Mike C. Fletcher", email = "mcfletch@vrplumber.com" }
]
keywords = [
    "PyOpenGL", "OpenGL", "Context", "OpenGLContext", "render", "3D",
    "TrueType", "text", "VRML", "VRML97", "scenegraph"
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Multimedia :: Graphics :: 3D Rendering",
    "Intended Audience :: Developers",
    "Environment :: X11 Applications",
    "Environment :: Win32 (MS Windows)",
]

dependencies = [
    "numpy>=2.0",
    "packaging>=22",
    "omi_audio>=0.4.0a1",
    "omi_physics>=0.4.0",
    "opengl_extrusions>=1.0.0",
    "pillow",
    "PyOpenGL>=4.0.0a1",
    "PyOpenGL-accelerate>=4.0.0a1",
    "PyVRML97>=2.4.0a2",
    "PyVRML97-accelerate>=2.3.5a1",
    "pydispatcher",
    "TTFQuery>=2.0.1a1",
    "simpleparse>=3.0.0a3",
    "pygltflib>=1.16",
]

[project.optional-dependencies]
# pygame-ce, not pygame: the two are rival distributions of the same `pygame`
# import, so a stack that installs both gets a broken one. PyOpenGL's own test
# backend uses pygame-ce, so the whole stack standardizes on it.
pygame = ["pygame-ce>=2.1.3"]
glfw = ["glfw>=2.0"]
# Recording what the engine draws to an H.264 video file. The encoder is the
# one in the graphics driver; this brings in the bindings that reach it.
video = ["pyopengl-video>=1.0.0a1"]
# gltf is now pretty much core to OpenGLContext...
gltf = []
draco = ["DracoPy>=1.4"]
# Sound that is actually heard. omi_audio itself is a core dependency -- the
# scenegraph's audio nodes are built on its model -- and it mixes happily with
# no backend at all; this extra adds the one that reaches a sound card. Optional
# for a concrete reason rather than a general preference: miniaudio publishes no
# manylinux aarch64 wheel, so a Raspberry Pi, an ARM server or a linux/arm64
# container would have to build the sdist and would want a compiler for it.
# Without it a scene with sounds in it still builds, still runs and stays silent
# (omi_audio.device). Re-check when a wheel appears; this is a response to a
# packaging gap and should not outlive it.
audio = ["omi_audio[playback]"]
# accelerate is now part of the core install; kept as an empty set so external
# setups that still request OpenGLContext[accelerate] don't break.
accelerate = []
all = ["OpenGLContext[pygame,glfw,gltf,draco,audio,accelerate]"]
# What `build-docs.py` needs to build the documentation set. The generator for
# the module pages is PyOpenGL's `directdocs`, which is in the PyOpenGL
# repository rather than in the PyOpenGL distribution, so it is not here: point
# DIRECTDOCS at a checkout of it.
# sphinxcontrib-mermaid imports yaml without declaring it.
docs = ["sphinx>=7", "furo", "sphinxcontrib-mermaid", "pyyaml"]
# The development environment builds the documentation too: the workspace
# syncs each project's dev extra, and a docs extra it skipped would leave
# `build-docs.py` without sphinxcontrib-mermaid.
dev = ["OpenGLContext[all,docs]","pytest", "pytest-cov", "pytest-html", "pytest-timeout", "psutil", "ruff", "mypy"]

[project.scripts]
oglc-test = "OpenGLContext.bin.gltest:main"
oglc-lorentz = "OpenGLContext.bin.lorentz:main"
oglc-view = "OpenGLContext.bin.view:main"
oglc-terrain = "OpenGLContext.bin.terrain_view:main"
oglc-gltf-demo = "OpenGLContext.bin.gltf_demo:main"
oglc-gltf-regression = "OpenGLContext.bin.gltf_regression:main"
oglc-ui-demo = "OpenGLContext.bin.ui_demo:main"
oglc-mirrors = "OpenGLContext.bin.mirrors_demo:main"
oglc-audio-demo = "OpenGLContext.bin.audio_demo:main"
oglc-physics-events = "OpenGLContext.bin.physics_events_demo:main"
oglc-zones = "OpenGLContext.bin.zones_demo:main"
oglc-lod = "OpenGLContext.bin.lod_demo:main"
oglc-cover = "OpenGLContext.bin.cover_demo:main"
oglc-character-sheet = "OpenGLContext.bin.character_sheet:main"
# Ship an application built on the engine as a Debian package: a relocatable
# CPython and the application on top of it, under /opt.
oglc-deb = "OpenGLContext.packaging.deb:main"
# Deprecated alias for oglc-view, which reads all four formats; a thin wrapper
# around it. Removed after one release cycle.
oglc-vrml = "OpenGLContext.bin.vrml_view:main"

# PyInstaller reads this to find the hooks in OpenGLContext/__pyinstaller, which
# tell it about the plug-in registries, the generated resource modules and the
# shader sources -- none of which it can see by following import statements.
# Nothing is imported from that package at run time.
[project.entry-points.pyinstaller40]
hook-dirs = "OpenGLContext.__pyinstaller:get_hook_dirs"

[project.urls]
Homepage = "http://pyopengl.sourceforge.net/context/"
Documentation = "http://pyopengl.sourceforge.net/context/documentation.html"
Repository = "https://github.com/mcfletch/openglcontext"

[tool.setuptools.dynamic]
version = {attr = "OpenGLContext.__version__"}

[tool.setuptools.packages.find]
where = ["."]
include = ["OpenGLContext*"]

[tool.setuptools.package-data]
# Anything the package opens by path at runtime. The icons, font atlases and
# `resources/*.txt` shaders are generated Python modules instead, so they travel
# as code; the cube-map faces are read as files by the demo `cube` background.
OpenGLContext = [
    # `py.typed` is what tells a checker the engine's declarations are real.
    # Without it every `Context`, every scenegraph node and every render pass
    # resolves to `Any` in the projects built on it, and their own typecheck
    # gates pass without having checked a single call into the engine.
    "py.typed",
    # The content packs the engine publishes: `oglc-view --pack` reads it.
    "packs.json",
    # The node namespace is filled from the plugin registry as it loads, so its
    # names exist only at run time; `scripts/write_basenodes_stub.py` writes the
    # declarations and this ships them.
    "scenegraph/*.pyi",
    "shaders/*.vert", "shaders/*.frag", "shaders/*.glsl",
    "resources/environment/*.jpg",
    # The exception to the rule above: the demos' packaging recipe is read
    # rather than opened -- a PyInstaller spec, a build script and the
    # distribution a .deb is built from -- and it ships so that somebody who
    # installed the engine rather than cloning it has it. See
    # demos/packaging/README.md.
    "demos/packaging/*", "demos/packaging/deb-project/*",
]

[tool.ruff]
# Test fixtures that carry a .py extension without being source: captured
# shader text and PNG bytes, held as modules so a test can import them. They
# are not UTF-8 and there is nothing in them for a linter to say.
extend-exclude = ["tests/resources"]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "B",   # flake8-bugbear
    "PGH003", "PGH004",  # a type: ignore or noqa names the codes it silences
    "PLE0604", "PLE0605",  # __all__ is a list or tuple of strings
    "TID251",  # the raw forms the engine has an API for (banned-api, below)
]
ignore = [
    "E501",  # line too long (handled by formatter)
    "E741",  # ambiguous variable name
    # `from OpenGL.GL import *` is how a GL program is written, and this engine
    # is written that way throughout; the names are there at run time. What
    # holds the modules to importing is the suite, which imports them.
    "F403",
    "F405",
    # Autogenerated boilerplate and the scenegraph's late imports both put
    # imports below the top of a module deliberately.
    "E402",
    # A name imported and not used here is often a re-export kept so that
    # `from OpenGLContext.passes.shaderpass import SHADER_DIR` and its like go
    # on working, or an import whose effect is to populate a registry --
    # `COMPILER_CLASSES` fills when `ifscompiler` loads. Removing those breaks
    # importers that this module exists to serve, and a checker cannot tell
    # them from a genuinely stray import.
    "F401",
    # Whitespace, accumulated since 2003. Putting it right is a deliberate pass
    # of its own, on its own commit, rather than something a release gate
    # forces into an unrelated change -- reflowing it would rewrite `git blame`
    # for most of the engine.
    "W291",
    "W293",
    "W292",
    "W191", # tab indentation
    "E101", # a file that mixes the two
    # `zip()` with no `strict=`. Whether a length mismatch is malformed input
    # or the expected shape is a decision per call site -- `zip(('shift',
    # 'ctrl','alt'), modifiers)` is meant to be ragged, `zip(self.faces,
    # self.datamap, renderingData)` is not -- and `strict=True` applied to the
    # ragged ones raises on scenes that load correctly today. Stopping at the
    # shortest is the behaviour the engine has always had; narrowing it is a
    # per-site audit, not a lint fix.
    "B905",
]

[tool.ruff.lint.flake8-tidy-imports.banned-api]
# The workspace's banned-api list (plans/DEFECT-PREVENTION.md): the raw form,
# and the engine API that replaces it.
"urllib.request.urlretrieve".msg = "fetch through OpenGLContext.loaders.resolver: fetch_to_cache or fetch_url with a CheckedURL"
"urllib.request.urlopen".msg = "open through OpenGLContext.loaders.resolver.open_url with a CheckedURL (checked_url, require_host, AllowedHosts.check), which puts every redirect to a policy"
"tarfile.TarFile.extractall".msg = "unpack through OpenGLContext.contentpacks.archive.extract, which refuses a member that leaves the directory and caps the size"
"zipfile.ZipFile.extractall".msg = "unpack through OpenGLContext.contentpacks.archive.extract, which refuses a member that leaves the directory and caps the size"
"shutil.rmtree".msg = "replace or remove a directory through OpenGLContext.atomicfiles: staged_directory, replace_directory or remove_directory"
"shutil.move".msg = "move a finished file or directory into place through OpenGLContext.atomicfiles: staged_file, staged_directory or replace_directory"
"os.rename".msg = "os.rename refuses an existing target on Windows; use os.replace, or OpenGLContext.atomicfiles"
"os._exit".msg = "exit through OpenGLContext.processexit.flush_and_exit, which flushes what was written first"
"os.environ".msg = "read through OpenGLContext.renderoptions (env_flag, env_number, env_choice, env_text, their _once forms, environment()); pin one with renderoptions.set_env or default_env"
"os.getenv".msg = "read through OpenGLContext.renderoptions (env_flag, env_number, env_choice, env_text, their _once forms)"

[tool.ruff.lint.per-file-ignores]
# The modules that implement a replacement use the raw form, and the tests,
# the scripts and the documentation build are programs that clean up after
# themselves and end their own processes.
"OpenGLContext/atomicfiles.py" = ["TID251"]
"OpenGLContext/processexit.py" = ["TID251"]
# The environment's readers and writers: renderoptions for the engine's own
# variables, userpaths for the platform's per-user directories, the test
# machinery, which builds the environment of the subprocesses it drives, and
# the viewer's command line, which puts its settings into the environment
# before a context exists.
"OpenGLContext/renderoptions.py" = ["TID251"]
"OpenGLContext/userpaths.py" = ["TID251"]
"OpenGLContext/testing/**" = ["TID251"]
"OpenGLContext/viewer/environment.py" = ["TID251"]
# Holds viewer work in progress that reads OPENGLCONTEXT_IBL_INTENSITY and
# GLTF directly; its reads move to renderoptions when that work lands, and
# this entry goes with them.
"OpenGLContext/viewer/sceneviewer.py" = ["TID251"]
"tests/**" = ["TID251"]
"scripts/**" = ["TID251"]
"build-docs.py" = ["TID251"]
"docbuild/**" = ["TID251"]
"docs/conf.py" = ["TID251"]

[tool.mypy]
# Matches the interpreter the project is developed and tested against.  The
# shipped numpy stubs use syntax that only parses under 3.12, so a lower value
# here does not check an older Python -- it aborts on numpy's own stub before
# checking anything at all.
python_version = "3.12"
# What is in the gate. The package ships ``py.typed``, so this is the surface a
# consumer's checker reads, and naming it here is what lets a bare ``mypy`` in
# this directory run the same check CI and ``tools/preflight.py`` run.
#
# Run it against an environment that has the stack installed non-editable --
# ``tox -e typecheck``, or the workspace's ``tools/preflight.py``. An editable
# install reaches its package through an import hook a checker cannot follow,
# so every sibling resolves to ``Any`` there and the run reports thousands of
# ``name-defined`` errors that say nothing about this code.
files = ["OpenGLContext"]
# The checked types (openglcontext-checks): a ContainedPath, CheckedURL or
# ContextKey is made only by the module that checks it, and a module in the
# `loader` scope of [tool.openglcontext-checks.scopes] opens only a
# ContainedPath. See docs/checks.rst.
plugins = ["openglcontext_checks.mypy_plugin"]
# A function with no annotations is not skipped: its body is checked with the
# parameters implicitly ``Any``, which is where most of the engine's code lives.
check_untyped_defs = true
# Every definition states its types, and a new one that does not is an error
# here rather than a hole a caller finds later: an unannotated parameter is
# ``Any``, and an ``Any`` travelling through a call is a check that reports
# success without having compared anything.
disallow_untyped_defs = true
disallow_incomplete_defs = true
warn_return_any = true
warn_unused_ignores = true
ignore_missing_imports = true

# numpy arithmetic is typed to return ``Any`` in the shipped stubs, so
# ``warn_return_any`` fires on nearly every array-returning function in the
# vectorized physics core and buries the genuine type errors.  Turn it off for
# that package only; every other check (arg types, optionals, attributes) stays on.
[[tool.mypy.overrides]]
module = "OpenGLContext.physics.*"
warn_return_any = false

# These environments resolve the engine's dependencies from an index, so they
# build only once the versions `[project] dependencies` names are published --
# between releases some of them exist in this checkout and nowhere else, and
# uv answers "not available". What holds this project to its declared gates in
# the meantime is `tools/preflight.py` in the workspace above, which installs
# every checkout into one environment and runs ruff, mypy and the suite there.
[tool.tox]
env_list = ["py310", "py311", "py312", "py313", "py314"]

[tool.tox.env_run_base]
extras = ["dev"]
# The core dependencies (PyOpenGL 4.0.0a, PyVRML97 2.3.5a, TTFQuery 2.0.1a,
# simpleparse 3.0.0a, omi_audio 0.4.0a) are published only as pre-releases,
# which uv/pip skip by default; without this the resolver reports them "not
# available" and the env fails to build. pip_pre is honoured by both the pip and
# the uv installers.
pip_pre = true
# Two passes, because a `serial` test compares wall-clock frame times and the
# ratio it is asserting compresses on a machine busy with the rest of the
# suite. The marker only means something if something acts on it, and a matrix
# cell -- running beside whatever else the machine is doing -- is where that
# matters most. The second pass is short and has the machine to itself.
commands = [
    ["pytest", "-m", "not serial", { replace = "posargs", extend = true }],
    ["pytest", "-m", "serial", { replace = "posargs", extend = true }],
]

# The shipped declarations, checked the way a consumer's checker reads them.
# `[tool.mypy]` says what is in the gate, so the run needs no paths. The install
# is not editable: an editable one reaches the package through an import hook
# mypy cannot follow, and every sibling then resolves to `Any`.
[tool.tox.env.typecheck]
extras = ["dev"]
# The mypy plugin `[tool.mypy] plugins` names.
deps = ["openglcontext-checks"]
pip_pre = true
package = "wheel"
commands = [["mypy", { replace = "posargs", extend = true }]]

[tool.pytest.ini_options]
testpaths = ["OpenGLContext/tests", "tests"]
# The GL-window fixtures the rendering tests ask for (gl_context, gl_window,
# gl_context_compat) ship in the package, so an application built on the engine
# turns on the same ones the same way -- see docs/testing.rst.
#
# `-ra` makes every run state its skips and xfails rather than folding them into
# a count. A skip is how a suite goes green without having run something, and a
# number at the end of a run says nothing about which platform fact each one is
# standing on -- or whether one of them is a test stepping around a defect.
addopts = "-p OpenGLContext.testing.plugin -ra"
# A division by zero, overflow or invalid operation in NumPy raises during a
# test (numpy.errstate, held by the plugin), so a NaN or an infinity made from
# numbers fails where it is made rather than reaching a picture or a position.
# A test that means to make one says so with numpy.errstate around it.
numpy_errors = "raise"
# A test fails that opened a file from a module of OpenGLContext outside the
# sanctioned openers (OpenGLContext.testing.openaudit). The list is the
# engine's openers, then the modules whose paths come from their own user,
# then the readers of document- and application-named files that open them
# directly, each of which leaves the list when it opens through
# loaders.resolver's checked paths.
open_audit = "fail"
open_audit_sanctioned = [
    "OpenGLContext.loaders.resolver",
    "OpenGLContext.contentpacks",
    "OpenGLContext.atomicfiles",
    "OpenGLContext.loaders.hdr",
    "OpenGLContext.loaders.hdri",
    "OpenGLContext.testing",
    # Programs, tools and the files their user names: the command line, a
    # screenshot, a recording, a session journal, the user's settings.
    "OpenGLContext.bin",
    "OpenGLContext.packaging",
    "OpenGLContext.capture",
    "OpenGLContext.contactsheet",
    "OpenGLContext.debug",
    "OpenGLContext.stalltrace",
    "OpenGLContext.telemetry",
    "OpenGLContext.video",
    "OpenGLContext.userpaths",
    "OpenGLContext.move.bindingstore",
    # Readers of document- and application-named files.
    "OpenGLContext.loaders.cc0",
    "OpenGLContext.loaders.gltf.lodasset",
    "OpenGLContext.loaders.gltf.writer",
    "OpenGLContext.loaders.loader",
    "OpenGLContext.loaders.tiles3d.dem",
    "OpenGLContext.loaders.tiles3d.foliage",
    "OpenGLContext.loaders.tiles3d.manifest",
    "OpenGLContext.passes.ibl",
    "OpenGLContext.scenegraph.audio",
    "OpenGLContext.scenegraph.instancedgl",
    "OpenGLContext.scenegraph.terrain.ground",
    "OpenGLContext.scenegraph.terrain.heightfield",
    "OpenGLContext.scenegraph.text._toolsfont",
    "OpenGLContext.scenegraph.tilesterrain",
    "OpenGLContext.scenegraph.vegetation.clumps",
    "OpenGLContext.scenegraph.vegetation.cover",
    "OpenGLContext.scenegraph.vegetation.nearmesh",
    "OpenGLContext.ui.pictures",
    "OpenGLContext.viewer.adapters",
    "OpenGLContext.viewer.source",
]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
# Backstop timeout so a single hung GL test can never wedge the whole session,
# independent of the custom subprocess runner's own per-script timeouts (whose
# ceiling is 120s). The slowest test that legitimately runs to completion takes
# about 25 seconds, so this is a wide margin rather than a deadline.
# Set via the ini keys rather than addopts so a checkout without pytest-timeout
# only warns about unknown options instead of erroring on `--timeout`.
timeout = 300
# The thread method, not the default signal one. pytest-timeout's signal method
# raises out of a SIGALRM handler, and a Python signal handler runs only when
# the main thread next executes bytecode -- which a thread waiting on CPython's
# import lock never does, because that lock is taken with the GIL released and
# is not interruptible. A suite that loads resources on worker threads can
# therefore reach a state that no signal can rescue: SIGALRM does nothing,
# SIGTERM does nothing, and the run sits until somebody sends SIGKILL. The
# thread method is a watchdog thread instead: it prints every thread's stack and
# ends the process, which turns such a hang into a red run with the evidence in
# it. The cost is that it ends the session rather than failing one test, and
# that is the right trade -- a timeout here is a defect to stop and fix.
timeout_method = "thread"
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "visual: marks tests as visual regression tests",
    "interactive: marks tests that use event simulation",
    "core_profile: marks tests that require core profile",
    "compatibility_profile: marks tests for compatibility profile",
    "network: marks tests that fetch remote sample assets",
    "serial: marks tests that need a quiet machine (no concurrent GPU/CPU load); wall-clock timing checks whose ratio compresses under load. Run them alone with '-m serial' after a '-m \"not serial\"' bulk pass.",
]

# The OGC rules (openglcontext-checks) this project is clean of, held by the
# workspace preflight. A rule joins the list once the engine is clean of it.
[tool.openglcontext-checks]
select = ["OGC101", "OGC102", "OGC111", "OGC121", "OGC131", "OGC141", "OGC161", "OGC201", "OGC221", "OGC222", "OGC223"]

# The modules the test rules (OGC221 to OGC223) read: the unit tests and the
# modules beside them that they import, and the pytest modules of tests/.
# The other scripts in tests/ are the demos and tutorials the visual suite
# runs in subprocesses; pytest collects nothing from them.
#
# The programs OGC161 does not read: files run by path, whose module level is
# their start-up and settles the renderer before anything imports OpenGL. They
# are the demos and tutorials in tests/ (less the pytest modules, conftest.py
# and the underscored modules the demos import), the subprocess drivers the
# unit tests start (less _crowd_asset.py, which tests import), the scripts/
# tools and Sphinx's conf.py.
[tool.openglcontext-checks.scopes]
test = ["tests/unit/**", "OpenGLContext/tests/**", "**/test_*.py", "**/conftest.py"]
script = [
    "tests/[!_]*.py", "!tests/test_*.py", "!tests/conftest.py",
    "tests/_gltf_toggle_driver.py",
    "tests/helpers/*.py", "!tests/helpers/_crowd_asset.py",
    "scripts/*.py",
    "docs/conf.py",
]
# The modules that read a document's values, sizes and file names -- the
# format loaders, the handlers a document's hooks name, and the readers of
# baked props, cover, zones, content-pack registries, key bindings and
# session journals -- which OGC101, OGC102 and OGC111 hold to DocumentValues,
# a size check and the resolver.
# The modules that draw, which OGC151 holds to restoring the GL state they
# change: every module of the engine.
pass = ["OpenGLContext/**"]
loader = [
    "OpenGLContext/loaders/**",
    "OpenGLContext/scenegraph/*hooks.py",
    "OpenGLContext/scenegraph/props.py",
    "OpenGLContext/scenegraph/tilesterrain.py",
    "OpenGLContext/scenegraph/vegetation/clumps.py",
    "OpenGLContext/scenegraph/vegetation/cover.py",
    "OpenGLContext/contentpacks/catalog.py",
    "OpenGLContext/contentpacks/pack.py",
    "OpenGLContext/move/bindingstore.py",
    "OpenGLContext/events/synthetic.py",
    "OpenGLContext/telemetry/replay.py",
]

# The engine's GL state managers (passes/glstate.py), which OGC151 accepts a
# state change inside.
[tool.openglcontext-checks.sanctioned]
OGC151 = [
    "OpenGLContext.passes.glstate.enabled",
    "OpenGLContext.passes.glstate.disabled",
    "OpenGLContext.passes.glstate.switched",
    "OpenGLContext.passes.glstate.bound_framebuffer",
    "OpenGLContext.passes.glstate.program",
    "OpenGLContext.passes.glstate.scissor",
    "OpenGLContext.passes.glstate.cull_face",
]

[tool.openglcontext-checks.per-file-ignores]
# A tutorial: its text is what docs/tutorials/hud_demo.rst shows, and its
# imports carry `# noqa: E402` for a rule the project's ruff selection already
# ignores. Tutorials are not edited for tooling.
"tests/hud_demo.py" = ["OGC201"]

# A tutorial (docs/tutorials/glprint.rst): the NeHe 13 port on WGL, whose
# font deletes its display lists in __del__ as the original lesson does, and
# which runs only on Windows under wxPython. Tutorials are not edited for
# tooling.
"tests/glprint.py" = ["OGC141"]

# The modules that implement the sanctioned APIs do what the rules report:
# the resolver decodes a data URI once check_size has passed it, and the GL
# state managers change the state they restore.
"OpenGLContext/loaders/resolver.py" = ["OGC102"]
"OpenGLContext/passes/glstate.py" = ["OGC151"]

# uv decides whether its cached metadata for a source tree is still current
# from pyproject.toml, setup.py and setup.cfg alone. This project's version
# lives in OpenGLContext/__init__.py, so name that file too: without it a
# version bump leaves uv answering with the previous number, and a dependent
# requiring the new one resolves against PyPI rather than this checkout.
[tool.uv]
cache-keys = [{ file = "pyproject.toml" }, { file = "OpenGLContext/__init__.py" }]
