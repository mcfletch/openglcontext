[build-system]
# setuptools >= 77 is required for the PEP 639 SPDX `license` expression below
# (61-76 reject the string form).
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "OpenGLContext"
dynamic = ["version"]
description = "Demonstration and testing contexts for PyOpenGL/OpenGL-ctypes"
readme = "README.md"
license = "BSD-3-Clause"
# The license file is lowercase, so it does NOT match setuptools' case-sensitive
# default LICEN[CS]E* glob and would be dropped from the wheel/sdist metadata.
# Name it explicitly so PEP 639 packaging carries it through.
license-files = ["license.txt"]
# numpy>=2.0 resolves to 2.1+ on new installs, which dropped Python 3.9, so the
# effective floor is 3.10 -- align requires-python with it.
requires-python = ">=3.10"
authors = [
    { name = "Mike C. Fletcher", email = "mcfletch@vrplumber.com" }
]
keywords = [
    "PyOpenGL", "OpenGL", "Context", "OpenGLContext", "render", "3D",
    "TrueType", "text", "VRML", "VRML97", "scenegraph"
]
classifiers = [
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Multimedia :: Graphics :: 3D Rendering",
    "Intended Audience :: Developers",
    "Environment :: X11 Applications",
    "Environment :: Win32 (MS Windows)",
]

dependencies = [
    "numpy>=2.0",
    "omi_audio>=0.2.0a1",
    "omi_physics>=0.3.0",
    "opengl_extrusions>=1.0.0",
    "pillow",
    "PyOpenGL>=4.0.0a1",
    "PyOpenGL-accelerate>=4.0.0a1",
    "PyVRML97>=2.3.4b1",
    "PyVRML97-accelerate>=2.3.4b1",
    "pydispatcher",
    "TTFQuery>=2.0.1a1",
    "simpleparse>=3.0.0a3",
    "pygltflib>=1.16",
]

[project.optional-dependencies]
# pygame-ce, not pygame: the two are rival distributions of the same `pygame`
# import, so a stack that installs both gets a broken one. PyOpenGL's own test
# backend uses pygame-ce, so the whole stack standardizes on it.
pygame = ["pygame-ce>=2.1.3"]
glfw = ["glfw>=2.0"]
# Recording what the engine draws to an H.264 video file. The encoder is the
# one in the graphics driver; this brings in the bindings that reach it.
video = ["pyopengl-video>=0.1.0a1"]
# gltf is now pretty much core to OpenGLContext...
gltf = []
draco = ["DracoPy>=1.4"]
# Sound that is actually heard. omi_audio itself is a core dependency -- the
# scenegraph's audio nodes are built on its model -- and it mixes happily with
# no backend at all; this extra adds the one that reaches a sound card. Optional
# for a concrete reason rather than a general preference: miniaudio publishes no
# manylinux aarch64 wheel, so a Raspberry Pi, an ARM server or a linux/arm64
# container would have to build the sdist and would want a compiler for it.
# Without it a scene with sounds in it still builds, still runs and stays silent
# (omi_audio.device). Re-check when a wheel appears; this is a response to a
# packaging gap and should not outlive it.
audio = ["omi_audio[playback]"]
# accelerate is now part of the core install; kept as an empty set so external
# setups that still request OpenGLContext[accelerate] don't break.
accelerate = []
all = ["OpenGLContext[pygame,glfw,gltf,draco,audio,accelerate]"]
dev = ["OpenGLContext[all]","pytest", "pytest-cov", "pytest-html", "pytest-timeout", "psutil", "ruff", "mypy"]

[project.scripts]
oglc-test = "OpenGLContext.bin.gltest:main"
oglc-lorentz = "OpenGLContext.bin.lorentz:main"
oglc-view = "OpenGLContext.bin.view:main"
oglc-terrain = "OpenGLContext.bin.terrain_view:main"
oglc-gltf-demo = "OpenGLContext.bin.gltf_demo:main"
oglc-gltf-regression = "OpenGLContext.bin.gltf_regression:main"
oglc-ui-demo = "OpenGLContext.bin.ui_demo:main"
oglc-character-sheet = "OpenGLContext.bin.character_sheet:main"
# Ship an application built on the engine as a Debian package: a relocatable
# CPython and the application on top of it, under /opt.
oglc-deb = "OpenGLContext.packaging.deb:main"
# Deprecated aliases for oglc-view, which reads all four formats; each of these
# three is now a thin wrapper around it. Removed after one release cycle.
oglc-vrml = "OpenGLContext.bin.vrml_view:main"
oglc-gltf = "OpenGLContext.bin.gltf_view:main"
oglc-tiles = "OpenGLContext.bin.tiles_view:main"

# PyInstaller reads this to find the hooks in OpenGLContext/__pyinstaller, which
# tell it about the plug-in registries, the generated resource modules and the
# shader sources -- none of which it can see by following import statements.
# Nothing is imported from that package at run time.
[project.entry-points.pyinstaller40]
hook-dirs = "OpenGLContext.__pyinstaller:get_hook_dirs"

[project.urls]
Homepage = "http://pyopengl.sourceforge.net/context/"
Documentation = "http://pyopengl.sourceforge.net/context/documentation.html"
Repository = "https://github.com/mcfletch/openglcontext"

[tool.setuptools.dynamic]
version = {attr = "OpenGLContext.__version__"}

[tool.setuptools.packages.find]
where = ["."]
include = ["OpenGLContext*"]

[tool.setuptools.package-data]
# Anything the package opens by path at runtime. The icons, font atlases and
# `resources/*.txt` shaders are generated Python modules instead, so they travel
# as code; the cube-map faces are read as files by the demo `cube` background.
OpenGLContext = [
    "shaders/*.vert", "shaders/*.frag", "shaders/*.glsl",
    "resources/environment/*.jpg",
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "B",   # flake8-bugbear
]
ignore = [
    "E501",  # line too long (handled by formatter)
    "E741",  # ambiguous variable name
]

[tool.mypy]
# Matches the interpreter the project is developed and tested against.  The
# shipped numpy stubs use syntax that only parses under 3.12, so a lower value
# here does not check an older Python -- it aborts on numpy's own stub before
# checking anything at all.
python_version = "3.12"
warn_return_any = true
warn_unused_ignores = true
ignore_missing_imports = true

# numpy arithmetic is typed to return ``Any`` in the shipped stubs, so
# ``warn_return_any`` fires on nearly every array-returning function in the
# vectorized physics core and buries the genuine type errors.  Turn it off for
# that package only; every other check (arg types, optionals, attributes) stays on.
[[tool.mypy.overrides]]
module = "OpenGLContext.physics.*"
warn_return_any = false

[tool.tox]
env_list = ["py310", "py311", "py312", "py313", "py314"]

[tool.tox.env_run_base]
extras = ["dev"]
# The core dependencies (PyOpenGL 4.0.0a, PyVRML97 2.3.4b, TTFQuery 2.0.1a,
# simpleparse 3.0.0a, omi_audio 0.2.0a) are published only as pre-releases,
# which uv/pip skip by default; without this the resolver reports them "not
# available" and the env fails to build. pip_pre is honoured by both the pip and
# the uv installers.
pip_pre = true
commands = [["pytest", { replace = "posargs", extend = true }]]

[tool.pytest.ini_options]
testpaths = ["OpenGLContext/tests", "tests"]
# The GL-window fixtures the rendering tests ask for (gl_context, gl_window,
# gl_context_compat) ship in the package, so an application built on the engine
# turns on the same ones the same way -- see docs/testing.html.
addopts = "-p OpenGLContext.testing.plugin"
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
# Backstop timeout so a single hung GL test can never wedge the whole session,
# independent of the custom subprocess runner's own per-script timeouts (4.36).
# Set via the ini key rather than addopts so a checkout without pytest-timeout
# only warns about an unknown option instead of erroring on `--timeout`.
timeout = 300
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "visual: marks tests as visual regression tests",
    "interactive: marks tests that use event simulation",
    "core_profile: marks tests that require core profile",
    "compatibility_profile: marks tests for compatibility profile",
    "network: marks tests that fetch remote sample assets",
    "serial: marks tests that need a quiet machine (no concurrent GPU/CPU load); wall-clock timing checks whose ratio compresses under load. Run them alone with '-m serial' after a '-m \"not serial\"' bulk pass.",
]

# uv decides whether its cached metadata for a source tree is still current
# from pyproject.toml, setup.py and setup.cfg alone. This project's version
# lives in OpenGLContext/__init__.py, so name that file too: without it a
# version bump leaves uv answering with the previous number, and a dependent
# requiring the new one resolves against PyPI rather than this checkout.
[tool.uv]
cache-keys = [{ file = "pyproject.toml" }, { file = "OpenGLContext/__init__.py" }]
